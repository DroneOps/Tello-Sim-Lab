name: aruco_board
description: >
  A wall 3 m ahead with four ArUco markers (DICT_4X4_50, ids 0-3, 15 cm) at 80–140 cm high,
  for visual servoing with the forward camera. A box on the floor at (60, 150) is in the way.
floor: {type: lab_grid}
start: {position: [0, 0], yaw_deg: 0}
objects:
  - {type: wall, start: [-250, 300], end: [250, 300], height_cm: 250, color: [200, 200, 190]}
  - {type: aruco, id: 0, mount: wall, position: [-60, 299, 140], size_cm: 15, facing_deg: 180}
  - {type: aruco, id: 1, mount: wall, position: [60, 299, 140], size_cm: 15, facing_deg: 180}
  - {type: aruco, id: 2, mount: wall, position: [-60, 299, 80], size_cm: 15, facing_deg: 180}
  - {type: aruco, id: 3, mount: wall, position: [60, 299, 80], size_cm: 15, facing_deg: 180}
  - {type: box, position: [60, 150], size: [40, 40, 35], color: [160, 120, 80]}
